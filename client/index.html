<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f0ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101017" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Remember — reconnect with who you are. A private memory, identity and reflection app." />
    <title>Remember</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b8244f'/%3E%3Cpath d='M10 21V11h5a3.2 3.2 0 0 1 0 6.4h-1.6L18 21' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong one.
      try {
        var t = localStorage.getItem('remember.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
